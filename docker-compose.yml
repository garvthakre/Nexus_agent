services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-queue}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    command: ["run", "--path", "/data", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - chroma_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8000'"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.docker}
      CHROMA_URL: http://chroma:8000
      VECTOR_PROVIDER: ${VECTOR_PROVIDER:-chroma}
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-6}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-gemini-2.5-flash}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.docker}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env.docker}
      ALLOW_SHELL_COMMANDS: ${ALLOW_SHELL_COMMANDS:-false}
      ALLOW_BROWSER_AUTOMATION: ${ALLOW_BROWSER_AUTOMATION:-true}
      ALLOW_FILE_OPERATIONS: ${ALLOW_FILE_OPERATIONS:-true}
      MAX_SHELL_COMMAND_LENGTH: ${MAX_SHELL_COMMAND_LENGTH:-500}
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      - nexus_logs:/app/nexus-logs
      - whatsapp_session:/app/whatsapp-session

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3001}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  chroma_data:
  nexus_logs:
  whatsapp_session:
