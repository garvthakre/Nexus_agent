<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    user-select: none;
    -webkit-app-region: no-drag;
  }

  /* ── COLLAPSED PILL ── */
  #pill {
    width: 220px;
    height: 40px;
    background: rgba(10, 27, 51, 0.92);
    border: 1px solid rgba(0, 186, 242, 0.4);
    border-radius: 20px;
    padding: 0 14px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4), 0 0 15px rgba(0, 186, 242, 0.2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  #pill:hover {
    border-color: #00BAF2;
    transform: translateY(1px);
    box-shadow: 0 8px 25px rgba(0, 186, 242, 0.35);
  }

  .pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00BAF2;
    box-shadow: 0 0 8px #00BAF2;
    animation: pulse 1.8s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(0.9); opacity: 0.7; }
    50% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(0.9); opacity: 0.7; }
  }

  .pill-title {
    font-size: 11px;
    font-weight: 700;
    color: #F8FAFC;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }

  .pill-shortcut {
    font-size: 9px;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #94A3B8;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: monospace;
  }

  /* ── EXPANDED CARD ── */
  #card {
    display: none;
    width: 380px;
    height: 480px;
    background: rgba(10, 27, 51, 0.96);
    border: 1px solid #1F3E6D;
    border-radius: 16px;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 186, 242, 0.15);
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  .card-header {
    height: 48px;
    background: rgba(17, 37, 68, 0.85);
    border-bottom: 1px solid #1F3E6D;
    padding: 0 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand-icon {
    width: 22px;
    height: 22px;
    background: #00BAF2;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #0A1B33;
    font-weight: 900;
    font-size: 12px;
  }

  .brand-text {
    font-size: 11px;
    font-weight: 800;
    color: #F8FAFC;
    letter-spacing: 0.8px;
  }

  .status-tag {
    font-size: 9px;
    color: #00BAF2;
    font-family: monospace;
  }

  .btn-close {
    background: none;
    border: none;
    color: #94A3B8;
    font-size: 15px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
  }

  .btn-close:hover {
    color: white;
    background: rgba(255, 255, 255, 0.1);
  }

  /* Shortcuts strip */
  .shortcuts-strip {
    padding: 10px 12px;
    background: rgba(13, 33, 63, 0.5);
    border-bottom: 1px solid rgba(31, 62, 109, 0.5);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .chip {
    font-size: 10.5px;
    padding: 4px 10px;
    background: #112544;
    border: 1px solid #1F3E6D;
    color: #E2E8F0;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .chip:hover {
    border-color: #00BAF2;
    color: #00BAF2;
    background: rgba(0, 186, 242, 0.15);
  }

  /* Feed / Status */
  .feed-area {
    flex: 1;
    padding: 12px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .status-line {
    font-size: 11px;
    color: #00BAF2;
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 500;
  }

  .step-box {
    background: rgba(17, 37, 68, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 11px;
    color: #CBD5E1;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .handoff-box {
    background: rgba(16, 185, 129, 0.12);
    border: 1px solid rgba(16, 185, 129, 0.35);
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 11px;
    color: #6EE7B7;
    line-height: 1.4;
  }

  /* Input area */
  .input-area {
    padding: 10px;
    background: rgba(17, 37, 68, 0.95);
    border-top: 1px solid #1F3E6D;
  }

  .input-row {
    display: flex;
    gap: 6px;
  }

  input[type="text"] {
    flex: 1;
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid #1F3E6D;
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 11.5px;
    color: white;
    outline: none;
    user-select: text;
    -webkit-user-select: text;
  }

  input[type="text"]:focus {
    border-color: #00BAF2;
  }

  .btn-submit {
    background: #00BAF2;
    color: #0A1B33;
    font-weight: 700;
    font-size: 11px;
    border: none;
    border-radius: 8px;
    padding: 0 14px;
    cursor: pointer;
  }

  .btn-submit:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
</style>
</head>
<body>

<!-- ── PILL (Collapsed State) ── -->
<div id="pill" onclick="openAssistant()">
  <div style="display: flex; align-items: center; gap: 8px;">
    <div class="pulse-dot"></div>
    <div class="pill-title">Nexus Assist</div>
  </div>
  <div class="pill-shortcut">Ctrl+Space</div>
</div>

<!-- ── CARD (Expanded State) ── -->
<div id="card">
  <div class="card-header">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div>
        <div class="brand-text">NEXUS COPILOT</div>
        <div class="status-tag">● ALWAYS ON DESKTOP</div>
      </div>
    </div>
    <button class="btn-close" onclick="closeAssistant()">✕</button>
  </div>

  <div class="shortcuts-strip">
    <div class="chip" style="border-color:#00BAF2;color:#00BAF2;background:rgba(0,186,242,0.15);" onclick="quickRun('Fill this form on the current page with 399 recharge for 9876543210 and proceed to checkout')">🎯 Scan & Act on Current Page</div>
    <div class="chip" onclick="quickRun('Do a recharge of 399 Airtel for 9876543210 and open checkout')">⚡ Airtel ₹399 Recharge</div>
    <div class="chip" onclick="quickRun('Recharge 299 Jio on mobile portal')">⚡ Jio ₹299 Plan</div>
  </div>

  <div class="feed-area" id="feed">
    <div class="status-line" id="status-text">⚡ Ready for any screen automation</div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <input type="text" id="prompt-input" placeholder="e.g. Recharge 399 Airtel..." onkeydown="handleKey(event)" />
      <button class="btn-submit" id="btn-go" onclick="submitPrompt()">Go</button>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 9.5px; color: #64748B; margin-top: 5px;">
      <span>Enter to execute</span>
      <span>Stops safely before payment</span>
    </div>
  </div>
</div>

<script>
  let isExpanded = false;
  const pill = document.getElementById('pill');
  const card = document.getElementById('card');
  const statusText = document.getElementById('status-text');
  const feed = document.getElementById('feed');
  const input = document.getElementById('prompt-input');
  const btnGo = document.getElementById('btn-go');

  function openAssistant() {
    isExpanded = true;
    pill.style.display = 'none';
    card.style.display = 'flex';
    if (window.overlayAPI) {
      window.overlayAPI.setExpanded(true);
    }
    input.focus();
  }

  function closeAssistant() {
    isExpanded = false;
    card.style.display = 'none';
    pill.style.display = 'flex';
    if (window.overlayAPI) {
      window.overlayAPI.setExpanded(false);
    }
  }

  function handleKey(e) {
    if (e.key === 'Enter') submitPrompt();
    if (e.key === 'Escape') closeAssistant();
  }

  function quickRun(text) {
    input.value = text;
    submitPrompt();
  }

  async function submitPrompt() {
    const text = input.value.trim();
    if (!text) return;

    btnGo.disabled = true;
    statusText.innerText = 'Analyzing request and compiling plan...';
    
    // Clear old steps
    feed.innerHTML = '<div class="status-line" id="status-text">⚡ Compiling plan...</div>';

    try {
      const token = localStorage.getItem('nexus_token');
      const authHeaders = { 'Content-Type': 'application/json' };
      if (token) authHeaders['Authorization'] = `Bearer ${token}`;

      const res = await fetch('http://localhost:3001/api/plan', {
        method: 'POST',
        headers: authHeaders,
        body: JSON.stringify({ prompt: text, requireCurrentPage: true })
      });
      const data = await res.json();
      
      if (!res.ok) throw new Error(data.error || 'Failed to create plan');

      const plan = data.plan;
      document.getElementById('status-text').innerText = `Plan created (${plan.steps.length} steps). Running...`;

      // Render steps
      feed.innerHTML = `<div class="status-line" id="status-text">⚡ Executing ${plan.steps.length} steps...</div>`;
      plan.steps.forEach(s => {
        const row = document.createElement('div');
        row.className = 'step-box';
        row.id = 'step-' + s.step_number;
        row.innerHTML = `<span>#${s.step_number} ${s.description}</span><span style="color:#00BAF2">•</span>`;
        feed.appendChild(row);
      });

      // Execute
      const executeRes = await fetch('http://localhost:3001/api/execute', {
        method: 'POST',
        headers: authHeaders,
        body: JSON.stringify({ sessionId: data.sessionId })
      });
      if (!executeRes.ok) {
        const executeData = await executeRes.json().catch(() => ({}));
        throw new Error(executeData.error || 'Failed to start execution');
      }

    } catch (err) {
      feed.innerHTML = `<div class="status-line" style="color:#EF4444;">❌ Error: ${err.message}</div>`;
      btnGo.disabled = false;
    }
  }

  // ── WebSocket Listener for Live Steps ──
  const ws = new WebSocket('ws://localhost:3001');
  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'step_start' && msg.stepNumber) {
        const el = document.getElementById('step-' + msg.stepNumber);
        if (el) el.querySelector('span:last-child').innerHTML = '<span style="color:#00BAF2;font-weight:bold;">Running</span>';
      } else if (msg.type === 'step_complete' && msg.stepNumber) {
        const el = document.getElementById('step-' + msg.stepNumber);
        if (el) el.querySelector('span:last-child').innerHTML = '<span style="color:#10B981;font-weight:bold;">✓</span>';
      } else if (msg.type === 'execution_complete') {
        const hBox = document.createElement('div');
        hBox.className = 'handoff-box';
        hBox.innerHTML = '<strong>🛡️ Safe Hand-off Complete:</strong> Reached destination / checkout page! Please enter your payment PIN / credentials directly to finish.';
        feed.appendChild(hBox);
        btnGo.disabled = false;
      }
    } catch (err) {}
  };
</script>
</body>
</html>
